name: Crypto Market Scanner

on:
  schedule:
    # Runs every 30 minutes 24/7 in GitHub Cloud:
    # - Detects good trade signals immediately at any 30m mark
    # - Sends morning briefing at 9:00 AM (13:00 UTC)
    # - Sends evening briefing at 7:00 PM (23:00 UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual "Run workflow" button in GitHub web or mobile app

jobs:
  scan:
    name: Scan Crypto Markets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas feedparser requests numpy lightgbm scikit-learn joblib

      - name: Run Crypto Scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'ben-secret107468' }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
        run: |
          python src/main.py --once $IS_MANUAL
